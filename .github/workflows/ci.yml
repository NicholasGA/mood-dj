name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 用 npm install（非 npm ci）：对 lockfile 不完整/跨 npm 版本解析差异更稳，CI 只作 build+test 闸门
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
